<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.dashboard{
    max-width:1200px;
    margin:auto;
}

h1{
    margin-bottom:20px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
}

.card h3{
    color:#666;
    margin-bottom:10px;
}

.card p{
    font-size:28px;
    font-weight:bold;
}

.content{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin-bottom:20px;
}

.activity{
    background:white;
    padding:20px;
    border-radius:10px;
}

.activity ul{
    list-style:none;
}

.activity li{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.table-section{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 20px 8px rgba(0,0,0,.1);
    overflow-x:auto;
}

table{
    width:100%;
}

th,
td{
    padding:12px;
    text-align:left;
    border-bottom:1px solid #ddd;
}

th{
    background:#f1f1f1;
}

</style>
</head>
<body>

<div class="dashboard">

    <h1>Analytics Dashboard</h1>

    <div class="cards">
        <div class="card">
            <h3>Revenue</h3>
            <p>$12K</p>
        </div>

        <div class="card">
            <h3>Users</h3>
            <p>1,240</p>
        </div>

        <div class="card">
            <h3>Orders</h3>
            <p>320</p>
        </div>

        <div class="card">
            <h3>Conversion</h3>
            <p>4.8%</p>
        </div>
    </div>

    <div class="content">
        <div class="activity">
            <h2>Recent Activity</h2>

            <ul>
                <li>New user registered</li>
                <li>Order #102 placed</li>
                <li>Payment received</li>
                <li>Dashboard updated</li>
            </ul>
        </div>

    </div>

    <div class="table-section">
        <h2>Top Products</h2>

        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Sales</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Laptop</td>
                    <td>120</td>
                </tr>

                <tr>
                    <td>Phone</td>
                    <td>95</td>
                </tr>

                <tr>
                    <td>Headphones</td>
                    <td>10</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
