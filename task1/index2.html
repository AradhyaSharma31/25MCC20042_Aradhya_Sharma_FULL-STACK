<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Clone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f3f3;
}

.navbar{
    background:#232F3E;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.search{
    flex:1;
    min-width:200px;
}

.search input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:4px;
}

.nav-links{
    display:flex;
    gap:20px;
}

.banner{
    background:#e3e6e6;
    text-align:center;
    padding:60px 20px;
}

.products{
    max-width:1200px;
    margin:20px auto;
    padding:0 20px;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    height:300px;
    width: 300px;
    background:white;
    padding:20px;
    border-radius:8px;
    text-align:center;
}

.image{
    height:150px;
    background:#bfaeae;
    border-radius:6px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    margin-bottom:15px;
}

button{
    padding:10px 15px;
    border:none;
    background:#f8bd19;
    border-radius:4px;
    cursor:pointer;
}

.footer{
    background:#232F3E;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo">amazon</div>

    <div class="search">
        <input type="text" placeholder="Search Amazon">
    </div>

    <div class="nav-links">
        <span>Account</span>
        <span>Orders</span>
        <span>Cart</span>
    </div>
</nav>

<section class="banner">
    <h1>Welcome to Amazon</h1>
    <p>Shop millions of products</p>
</section>

<section class="products">

    <div class="card">
        <div class="image"></div>
        <h3>Product 1</h3>
        <p>99 INR</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <div class="image"></div>
        <h3>Product 2</h3>
        <p>149 INR</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <div class="image"></div>
        <h3>Product 3</h3>
        <p>199 INR</p>
        <button>Add to Cart</button>
    </div>

    <div class="card">
        <div class="image"></div>
        <h3>Product 4</h3>
        <p>249 INR</p>
        <button>Add to Cart</button>
    </div>

</section>

<footer class="footer">
    <p>Amazon</p>
</footer>

</body>
</html>
